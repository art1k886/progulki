<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Path / Track Premium</title>

    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1f1f1f;
            --border-color: #2e2e2e;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --danger-color: #e53935;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-speed: 0.2s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            overflow: hidden;
            user-select: none;
        }

        /* Оптимизация для 60/120 FPS */
        .app-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.98);
            transition: opacity var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1),
                        transform var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1),
                        visibility var(--transition-speed);
            will-change: transform, opacity;
            z-index: 1;
            background-color: var(--bg-primary);
        }

        .app-screen.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            z-index: 10;
        }

        .header {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color var(--transition-speed);
        }

        .btn-icon:hover {
            background-color: var(--bg-tertiary);
        }

        .btn-primary {
            width: 100%;
            padding: 18px 24px;
            background-color: var(--text-primary);
            color: var(--bg-primary);
            border: 1px solid var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: background-color var(--transition-speed), transform 0.1s ease;
            will-change: transform;
        }

        .btn-primary:active {
            transform: scale(0.97);
            background-color: #cccccc;
        }

        .btn-secondary {
            width: 100%;
            padding: 18px 24px;
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: border-color var(--transition-speed), background-color var(--transition-speed), transform 0.1s ease;
            will-change: transform;
        }

        .btn-secondary:active {
            transform: scale(0.97);
            background-color: var(--bg-tertiary);
            border-color: var(--text-secondary);
        }

        #screen-menu {
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .menu-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-logo {
            margin-bottom: 40px;
            text-align: center;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-top: 6px;
            text-transform: uppercase;
        }

        .walk-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .walk-item {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 18px;
            cursor: pointer;
            transition: border-color var(--transition-speed), transform 0.15s ease;
            will-change: transform;
        }

        .walk-item:active {
            transform: scale(0.98);
            border-color: var(--text-secondary);
        }

        .walk-date {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .walk-metrics {
            display: flex;
            gap: 24px;
        }

        .metric-group {
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-value {
            font-size: 13px;
            font-weight: 500;
            margin-top: 2px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 40px;
        }

        /* Карта в реальном времени при трекинге */
        #tracking-map-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .tracking-overlay-top {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .tracking-badge {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
        }

        .pulse-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--danger-color);
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }

        .tracking-timer {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
        }

        .tracking-overlay-bottom {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            z-index: 10;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .live-metrics {
            display: flex;
            justify-content: space-around;
        }

        #map-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .map-overlay-top {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }

        .map-overlay-top > * {
            pointer-events: auto;
        }

        .map-controls-group {
            display: flex;
            gap: 4px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 4px;
        }

        .layer-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: color var(--transition-speed), background-color var(--transition-speed);
        }

        .layer-btn.active {
            color: var(--bg-primary);
            background-color: var(--text-primary);
        }

        .map-overlay-bottom {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            z-index: 10;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timeline-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider-container {
            flex: 1;
            display: flex;
            align-items: center;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: var(--bg-tertiary);
            height: 4px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--text-primary);
            cursor: pointer;
            border: none;
        }

        .time-display {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            width: 50px;
            text-align: right;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-speed);
            will-change: opacity;
        }

        .modal-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 24px;
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .modal-desc {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        /* Ч/Б стиль карты OSM */
        .monochrome-map .maplibregl-canvas {
            filter: grayscale(100%) invert(90%) contrast(120%);
        }
    </style>
</head>
<body>

    <section id="screen-menu" class="app-screen active">
        <div class="brand-logo">
            <div class="brand-title">PATH / TRACK</div>
            <div class="brand-subtitle">Автономный Навигатор</div>
        </div>
        <div class="menu-container">
            <button class="btn-primary" onclick="app.requestAndStartTracking()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Начать
            </button>
            <button class="btn-secondary" onclick="app.showScreen('screen-history')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                Предыдущие
            </button>
        </div>
    </section>

    <section id="screen-history" class="app-screen">
        <div class="header">
            <button class="btn-icon" onclick="app.showScreen('screen-menu')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <div class="header-title">История Прогулок</div>
            <div style="width: 40px;"></div>
        </div>
        <div class="walk-list" id="history-container"></div>
    </section>

    <section id="screen-tracking" class="app-screen">
        <div id="tracking-map-container"></div>

        <div class="tracking-overlay-top">
            <div class="tracking-badge">
                <div class="pulse-indicator"></div>
                <div class="tracking-timer" id="tracking-timer">00:00:00</div>
            </div>
            <div class="map-controls-group">
                <button class="layer-btn active" id="btn-tr-layer-osm" onclick="app.setTrackingMapLayer('osm')">Mono</button>
                <button class="layer-btn" id="btn-tr-layer-topo" onclick="app.setTrackingMapLayer('topo')">Topo</button>
                <button class="layer-btn" id="btn-tr-layer-sat" onclick="app.setTrackingMapLayer('sat')">Sat</button>
            </div>
        </div>

        <div class="tracking-overlay-bottom">
            <div class="live-metrics">
                <div class="metric-group">
                    <span class="metric-label">Дистанция</span>
                    <span class="metric-value" id="live-distance">0.00 км</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">Ср. Скорость</span>
                    <span class="metric-value" id="live-speed">0.0 км/ч</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">Точек GPS</span>
                    <span class="metric-value" id="live-points">0</span>
                </div>
            </div>
            <button class="btn-primary" style="border-color: var(--danger-color); background-color: var(--danger-color); color: #fff;" onclick="app.stopTracking()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"></rect></svg>
                Завершить Прогулку
            </button>
        </div>
    </section>

    <section id="screen-map" class="app-screen">
        <div id="map-container"></div>

        <div class="map-overlay-top">
            <button class="btn-icon" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color);" onclick="app.showScreen('screen-history')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <div class="map-controls-group">
                <button class="layer-btn active" id="btn-layer-osm" onclick="app.setMapLayer('osm')">Mono</button>
                <button class="layer-btn" id="btn-layer-topo" onclick="app.setMapLayer('topo')">Topo</button>
                <button class="layer-btn" id="btn-layer-sat" onclick="app.setMapLayer('sat')">Sat</button>
            </div>
        </div>

        <div class="map-overlay-bottom">
            <div class="walk-metrics" style="justify-content: space-between;">
                <div class="metric-group">
                    <span class="metric-label" id="map-date-label">Дата</span>
                    <span class="metric-value" id="map-metrics-dist">0 км</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">Ср. Скорость</span>
                    <span class="metric-value" id="map-metrics-speed">0 км/ч</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">Время</span>
                    <span class="metric-value" id="map-metrics-time">00:00</span>
                </div>
            </div>

            <div class="timeline-controls">
                <button class="btn-icon" id="btn-timelapse" onclick="app.toggleTimelapse()" style="border: 1px solid var(--border-color);">
                    <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
                <div class="slider-container">
                    <input type="range" id="timeline-slider" min="0" max="100" value="100" oninput="app.onTimelineInput(this.value)">
                </div>
                <div class="time-display" id="timeline-time">00:00</div>
            </div>
        </div>
    </section>

    <div class="modal-backdrop" id="modal-delete">
        <div class="modal-box">
            <div class="modal-title">Удаление Записи</div>
            <div class="modal-desc">Вы действительно хотите удалить эту прогулку? Это действие нельзя отменить.</div>
            <div class="modal-actions">
                <button class="btn-secondary" onclick="app.closeDeleteModal()">Отмена</button>
                <button class="btn-primary" style="background-color: var(--danger-color); border-color: var(--danger-color); color: #fff;" onclick="app.confirmDelete()">Удалить</button>
            </div>
        </div>
    </div>

    <script>
        class RouteTrackerApp {
            constructor() {
                this.storageKey = 'path_tracker_walks';
                this.walks = this.loadWalks();
                
                this.watchId = null;
                this.currentTrack = [];
                this.startTime = null;
                this.timerInterval = null;
                
                this.map = null;
                this.trackingMap = null;
                this.selectedWalk = null;
                
                this.timelapseFrame = null;
                this.isTimelapsePlaying = false;
                this.lastFrameTime = 0;
                
                this.itemToDeleteId = null;
                this.longPressTimer = null;

                this.initMaps();
            }

            loadWalks() {
                const data = localStorage.getItem(this.storageKey);
                return data ? JSON.parse(data) : [];
            }

            saveWalks() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.walks));
            }

            showScreen(screenId) {
                document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById(screenId);
                if (target) target.classList.add('active');

                if (screenId === 'screen-history') {
                    this.renderHistory();
                } else if (screenId === 'screen-map') {
                    setTimeout(() => { if (this.map) this.map.resize(); }, 200);
                } else if (screenId === 'screen-tracking') {
                    setTimeout(() => { if (this.trackingMap) this.trackingMap.resize(); }, 200);
                }
            }

            // Источники карт Google без API + OpenStreetMap
            getMapStyleSources() {
                return {
                    'osm-tiles': {
                        type: 'raster',
                        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: '© OpenStreetMap'
                    },
                    'google-topo-tiles': {
                        type: 'raster',
                        tiles: ['https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}'],
                        tileSize: 256,
                        attribution: '© Google Maps'
                    },
                    'google-sat-tiles': {
                        type: 'raster',
                        tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
                        tileSize: 256,
                        attribution: '© Google Maps'
                    }
                };
            }

            getMapStyleLayers() {
                return [
                    { id: 'layer-sat', type: 'raster', source: 'google-sat-tiles', layout: { visibility: 'none' } },
                    { id: 'layer-topo', type: 'raster', source: 'google-topo-tiles', layout: { visibility: 'none' } },
                    { id: 'layer-osm', type: 'raster', source: 'osm-tiles', layout: { visibility: 'visible' } }
                ];
            }

            initMaps() {
                // 1. Карта просмотра маршрутов
                this.map = new maplibregl.Map({
                    container: 'map-container',
                    style: {
                        version: 8,
                        sources: this.getMapStyleSources(),
                        layers: this.getMapStyleLayers()
                    },
                    center: [30.5234, 50.4501],
                    zoom: 12
                });
                document.getElementById('map-container').classList.add('monochrome-map');

                this.map.on('load', () => {
                    this.map.addSource('route-source', {
                        type: 'geojson',
                        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
                    });
                    this.map.addLayer({
                        id: 'route-layer',
                        type: 'line',
                        source: 'route-source',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#ffffff', 'line-width': 4 }
                    });
                    this.map.addSource('point-source', {
                        type: 'geojson',
                        data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0, 0] } }
                    });
                    this.map.addLayer({
                        id: 'point-layer',
                        type: 'circle',
                        source: 'point-source',
                        paint: {
                            'circle-radius': 6,
                            'circle-color': '#ffffff',
                            'circle-stroke-width': 2,
                            'circle-stroke-color': '#0a0a0a'
                        }
                    });
                });

                // 2. Карта для отслеживания в реальном времени
                this.trackingMap = new maplibregl.Map({
                    container: 'tracking-map-container',
                    style: {
                        version: 8,
                        sources: this.getMapStyleSources(),
                        layers: this.getMapStyleLayers()
                    },
                    center: [30.5234, 50.4501],
                    zoom: 16
                });
                document.getElementById('tracking-map-container').classList.add('monochrome-map');

                this.trackingMap.on('load', () => {
                    this.trackingMap.addSource('live-route-source', {
                        type: 'geojson',
                        data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } }
                    });
                    this.trackingMap.addLayer({
                        id: 'live-route-layer',
                        type: 'line',
                        source: 'live-route-source',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#ffffff', 'line-width': 5 }
                    });
                    this.trackingMap.addSource('live-point-source', {
                        type: 'geojson',
                        data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0, 0] } }
                    });
                    this.trackingMap.addLayer({
                        id: 'live-point-layer',
                        type: 'circle',
                        source: 'live-point-source',
                        paint: {
                            'circle-radius': 8,
                            'circle-color': '#ffffff',
                            'circle-stroke-width': 3,
                            'circle-stroke-color': '#e53935'
                        }
                    });
                });
            }

            requestAndStartTracking() {
                if (!navigator.geolocation) {
                    alert('Геолокация не поддерживается вашим браузером.');
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        this.startTracking(pos);
                    },
                    (err) => {
                        let msg = 'Не удалось получить доступ к геолокации.';
                        if (err.code === err.PERMISSION_DENIED) {
                            msg = 'Доступ к геолокации отклонен.';
                        }
                        alert(msg);
                    },
                    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
                );
            }

            startTracking(initialPos) {
                this.currentTrack = [];
                this.startTime = new Date();

                this.showScreen('screen-tracking');

                if (initialPos) {
                    this.onLocationUpdate(initialPos);
                }

                this.timerInterval = setInterval(() => this.updateTimer(), 1000);

                this.watchId = navigator.geolocation.watchPosition(
                    (pos) => this.onLocationUpdate(pos),
                    (err) => console.warn('Ошибка геолокации:', err),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
                );
            }

            onLocationUpdate(pos) {
                const point = {
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    timestamp: new Date().getTime()
                };

                const lastPoint = this.currentTrack[this.currentTrack.length - 1];
                if (lastPoint && lastPoint.lat === point.lat && lastPoint.lng === point.lng) {
                    return;
                }

                this.currentTrack.push(point);
                this.updateLiveMetrics();
                this.updateLiveMap();
            }

            updateLiveMap() {
                if (!this.trackingMap || this.currentTrack.length === 0) return;

                const coords = this.currentTrack.map(p => [p.lng, p.lat]);
                const lastCoord = coords[coords.length - 1];

                // Обновляем линию трека
                if (this.trackingMap.getSource('live-route-source')) {
                    this.trackingMap.getSource('live-route-source').setData({
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: coords }
                    });
                }

                // Обновляем текущую позицию
                if (this.trackingMap.getSource('live-point-source')) {
                    this.trackingMap.getSource('live-point-source').setData({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: lastCoord }
                    });
                }

                // Плавное смещение карты за пользователем (60/120 FPS)
                requestAnimationFrame(() => {
                    this.trackingMap.easeTo({
                        center: lastCoord,
                        zoom: 17,
                        duration: 800
                    });
                });
            }

            updateTimer() {
                const elapsedSec = Math.floor((new Date() - this.startTime) / 1000);
                const hrs = String(Math.floor(elapsedSec / 3600)).padStart(2, '0');
                const mins = String(Math.floor((elapsedSec % 3600) / 60)).padStart(2, '0');
                const secs = String(elapsedSec % 60).padStart(2, '0');
                document.getElementById('tracking-timer').innerText = `${hrs}:${mins}:${secs}`;
            }

            updateLiveMetrics() {
                const distMeters = this.calculateDistance(this.currentTrack);
                const distKm = (distMeters / 1000).toFixed(2);
                document.getElementById('live-distance').innerText = `${distKm} км`;

                const durationHours = (new Date() - this.startTime) / 1000 / 3600;
                const avgSpeed = durationHours > 0 ? (distKm / durationHours).toFixed(1) : '0.0';
                document.getElementById('live-speed').innerText = `${avgSpeed} км/ч`;
                document.getElementById('live-points').innerText = `${this.currentTrack.length}`;
            }

            stopTracking() {
                if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
                clearInterval(this.timerInterval);

                if (this.currentTrack.length === 0) {
                    alert('Данные геолокации не были получены.');
                    this.showScreen('screen-menu');
                    return;
                }

                const endTime = new Date();
                const totalDistMeters = this.calculateDistance(this.currentTrack);
                const durationHours = Math.max((endTime - this.startTime) / 1000 / 3600, 0.0001);
                const avgSpeed = ((totalDistMeters / 1000) / durationHours).toFixed(1);

                const newWalk = {
                    id: Date.now().toString(),
                    startTime: this.startTime.toISOString(),
                    endTime: endTime.toISOString(),
                    distance: totalDistMeters,
                    avgSpeed: parseFloat(avgSpeed),
                    track: this.currentTrack
                };

                this.walks.unshift(newWalk);
                this.saveWalks();

                this.openWalkOnMap(newWalk.id);
            }

            renderHistory() {
                const container = document.getElementById('history-container');
                container.innerHTML = '';

                if (this.walks.length === 0) {
                    container.innerHTML = '<div class="empty-state">Нет сохраненных прогулок</div>';
                    return;
                }

                this.walks.forEach(walk => {
                    const el = document.createElement('div');
                    el.className = 'walk-item';

                    const start = new Date(walk.startTime);
                    const end = new Date(walk.endTime);
                    
                    const dateStr = start.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const timeStartStr = start.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    const timeEndStr = end.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

                    const distStr = walk.distance >= 1000 
                        ? `${(walk.distance / 1000).toFixed(2)} км` 
                        : `${Math.round(walk.distance)} м`;

                    el.innerHTML = `
                        <div class="walk-date">${dateStr} ${timeStartStr} - ${timeEndStr}</div>
                        <div class="walk-metrics">
                            <div class="metric-group">
                                <span class="metric-label">Дистанция</span>
                                <span class="metric-value">${distStr}</span>
                            </div>
                            <div class="metric-group">
                                <span class="metric-label">Ср. Скорость</span>
                                <span class="metric-value">${walk.avgSpeed} км/ч</span>
                            </div>
                        </div>
                    `;

                    el.addEventListener('click', () => {
                        if (!this.longPressTriggered) {
                            this.openWalkOnMap(walk.id);
                        }
                    });

                    const startPress = () => {
                        this.longPressTriggered = false;
                        this.longPressTimer = setTimeout(() => {
                            this.longPressTriggered = true;
                            this.openDeleteModal(walk.id);
                        }, 700);
                    };

                    const cancelPress = () => {
                        clearTimeout(this.longPressTimer);
                    };

                    el.addEventListener('touchstart', startPress, {passive: true});
                    el.addEventListener('touchend', cancelPress);
                    el.addEventListener('mousedown', startPress);
                    el.addEventListener('mouseup', cancelPress);
                    el.addEventListener('mouseleave', cancelPress);

                    container.appendChild(el);
                });
            }

            openDeleteModal(id) {
                this.itemToDeleteId = id;
                document.getElementById('modal-delete').classList.add('active');
            }

            closeDeleteModal() {
                this.itemToDeleteId = null;
                document.getElementById('modal-delete').classList.remove('active');
            }

            confirmDelete() {
                if (this.itemToDeleteId) {
                    this.walks = this.walks.filter(w => w.id !== this.itemToDeleteId);
                    this.saveWalks();
                    this.renderHistory();
                }
                this.closeDeleteModal();
            }

            setMapLayer(layerType) {
                this.applyLayerToMap(this.map, 'map-container', layerType, 'btn-layer');
            }

            setTrackingMapLayer(layerType) {
                this.applyLayerToMap(this.trackingMap, 'tracking-map-container', layerType, 'btn-tr-layer');
            }

            applyLayerToMap(mapInstance, containerId, layerType, btnPrefix) {
                if (!mapInstance) return;

                document.querySelectorAll(`[id^="${btnPrefix}-"]`).forEach(b => b.classList.remove('active'));
                const targetBtn = document.getElementById(`${btnPrefix}-${layerType}`);
                if (targetBtn) targetBtn.classList.add('active');

                const container = document.getElementById(containerId);
                if (layerType === 'osm') {
                    container.classList.add('monochrome-map');
                } else {
                    container.classList.remove('monochrome-map');
                }

                ['osm', 'topo', 'sat'].forEach(l => {
                    mapInstance.setLayoutProperty(`layer-${l}`, 'visibility', l === layerType ? 'visible' : 'none');
                });
            }

            openWalkOnMap(walkId) {
                this.selectedWalk = this.walks.find(w => w.id === walkId);
                if (!this.selectedWalk || !this.selectedWalk.track.length) return;

                this.showScreen('screen-map');
                this.stopTimelapse();

                const start = new Date(this.selectedWalk.startTime);
                const end = new Date(this.selectedWalk.endTime);
                const durationMin = Math.round((end - start) / 1000 / 60);

                document.getElementById('map-date-label').innerText = start.toLocaleDateString('ru-RU');
                document.getElementById('map-metrics-dist').innerText = this.selectedWalk.distance >= 1000 
                    ? `${(this.selectedWalk.distance / 1000).toFixed(2)} км` 
                    : `${Math.round(this.selectedWalk.distance)} м`;
                document.getElementById('map-metrics-speed').innerText = `${this.selectedWalk.avgSpeed} км/ч`;
                document.getElementById('map-metrics-time').innerText = `${durationMin} мин`;

                const slider = document.getElementById('timeline-slider');
                slider.max = this.selectedWalk.track.length - 1;
                slider.value = this.selectedWalk.track.length - 1;

                const coordinates = this.selectedWalk.track.map(p => [p.lng, p.lat]);
                
                if (coordinates.length === 1) {
                    this.map.flyTo({ center: coordinates[0], zoom: 16 });
                } else {
                    const bounds = coordinates.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
                    this.map.fitBounds(bounds, { padding: 50, animate: false });
                }

                this.updateMapRoute(this.selectedWalk.track.length - 1);
            }

            updateMapRoute(index) {
                if (!this.selectedWalk) return;

                const slicedTrack = this.selectedWalk.track.slice(0, parseInt(index) + 1);
                const coords = slicedTrack.map(p => [p.lng, p.lat]);

                if (this.map.getSource('route-source')) {
                    this.map.getSource('route-source').setData({
                        type: 'Feature',
                        geometry: { 
                            type: coords.length > 1 ? 'LineString' : 'MultiPoint', 
                            coordinates: coords.length > 1 ? coords : (coords.length === 1 ? [coords[0]] : []) 
                        }
                    });
                }

                if (coords.length > 0 && this.map.getSource('point-source')) {
                    const currentPoint = coords[coords.length - 1];
                    this.map.getSource('point-source').setData({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: currentPoint }
                    });

                    const pointTime = new Date(slicedTrack[slicedTrack.length - 1].timestamp);
                    document.getElementById('timeline-time').innerText = pointTime.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                }
            }

            onTimelineInput(val) {
                this.stopTimelapse();
                this.updateMapRoute(val);
            }

            toggleTimelapse() {
                if (this.isTimelapsePlaying) {
                    this.stopTimelapse();
                } else {
                    this.startTimelapse();
                }
            }

            /* Анимация Таймлапса на 60 / 120 FPS через requestAnimationFrame */
            startTimelapse() {
                const slider = document.getElementById('timeline-slider');
                if (parseInt(slider.value) >= parseInt(slider.max)) {
                    slider.value = 0;
                }

                this.isTimelapsePlaying = true;
                document.getElementById('icon-play').style.display = 'none';
                document.getElementById('icon-pause').style.display = 'block';

                this.lastFrameTime = performance.now();

                const loop = (time) => {
                    if (!this.isTimelapsePlaying) return;

                    // Обновляем кадр каждые 80мс независимо от частоты экрана
                    if (time - this.lastFrameTime > 80) {
                        let curr = parseInt(slider.value);
                        let max = parseInt(slider.max);

                        if (curr < max) {
                            slider.value = curr + 1;
                            this.updateMapRoute(slider.value);
                            this.lastFrameTime = time;
                        } else {
                            this.stopTimelapse();
                            return;
                        }
                    }

                    this.timelapseFrame = requestAnimationFrame(loop);
                };

                this.timelapseFrame = requestAnimationFrame(loop);
            }

            stopTimelapse() {
                this.isTimelapsePlaying = false;
                if (this.timelapseFrame) cancelAnimationFrame(this.timelapseFrame);
                document.getElementById('icon-play').style.display = 'block';
                document.getElementById('icon-pause').style.display = 'none';
            }

            calculateDistance(track) {
                let total = 0;
                for (let i = 0; i < track.length - 1; i++) {
                    total += this.haversineDistance(track[i], track[i + 1]);
                }
                return total;
            }

            haversineDistance(coords1, coords2) {
                const R = 6371000;
                const dLat = this.toRad(coords2.lat - coords1.lat);
                const dLon = this.toRad(coords2.lng - coords1.lng);
                const lat1 = this.toRad(coords1.lat);
                const lat2 = this.toRad(coords2.lat);

                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                        Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(lat1) * Math.cos(lat2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            toRad(value) {
                return value * Math.PI / 180;
            }
        }

        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new RouteTrackerApp();
        });
    </script>
</body>
