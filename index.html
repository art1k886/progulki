<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walk Tracker Pro</title>
    
    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>

    <style>
        /* ============================================
           БАЗОВЫЙ СТИЛЬ И ПЕРЕМЕННЫЕ
           ============================================ */
        :root {
            --color-white: #ffffff;
            --color-black: #000000;
            --color-dark-gray: #1a1a1a;
            --color-medium-gray: #333333;
            --color-light-gray: #f5f5f5;
            --color-border-gray: #e0e0e0;
            --color-accent: #000000;
            --color-accent-alt: #cc0000;
            --color-text-primary: #000000;
            --color-text-secondary: #666666;
            
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
            
            --font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            --font-size-xs: 12px;
            --font-size-sm: 14px;
            --font-size-base: 16px;
            --font-size-lg: 18px;
            --font-size-xl: 24px;
            --font-size-2xl: 32px;
            
            --border-radius: 8px;
            --transition-duration: 0.3s;
            --box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            --box-shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: var(--font-family);
            background-color: var(--color-white);
            color: var(--color-text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            overflow: hidden;
        }

        /* ============================================
           СТРУКТУРА И МАКЕТ
           ============================================ */
        #app {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--color-white);
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity var(--transition-duration) ease-in-out;
            z-index: 1;
        }

        .screen.active {
            display: flex;
            opacity: 1;
            z-index: 10;
        }

        /* ============================================
           ГЛАВНОЕ МЕНЮ
           ============================================ */
        .menu-screen {
            justify-content: center;
            align-items: center;
            padding: var(--spacing-lg);
            background-color: var(--color-white);
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-lg);
            width: 100%;
            max-width: 400px;
        }

        .menu-title {
            font-size: var(--font-size-2xl);
            font-weight: 700;
            letter-spacing: -0.5px;
            text-align: center;
            margin-bottom: var(--spacing-md);
            line-height: 1.2;
        }

        .menu-button {
            height: 56px;
            padding: var(--spacing-md);
            border: 2px solid var(--color-black);
            background-color: var(--color-white);
            color: var(--color-black);
            font-size: var(--font-size-lg);
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all var(--transition-duration) ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-button:hover {
            background-color: var(--color-black);
            color: var(--color-white);
            transform: translateY(-2px);
        }

        .menu-button:active {
            transform: translateY(0);
        }

        /* ============================================
           ЭКРАН СПИСОК ПРОГУЛОК
           ============================================ */
        .history-screen {
            flex-direction: column;
            background-color: var(--color-white);
        }

        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--color-border-gray);
            height: 56px;
        }

        .header-title {
            font-size: var(--font-size-lg);
            font-weight: 600;
        }

        .header-button {
            width: 40px;
            height: 40px;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition-duration) ease;
        }

        .header-button:hover {
            transform: scale(1.1);
        }

        .header-button svg {
            width: 24px;
            height: 24px;
            stroke: var(--color-black);
            stroke-width: 2;
            fill: none;
        }

        .walks-list {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
        }

        .walks-list::-webkit-scrollbar {
            width: 6px;
        }

        .walks-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .walks-list::-webkit-scrollbar-thumb {
            background: var(--color-medium-gray);
            border-radius: 3px;
        }

        .walk-item {
            padding: var(--spacing-md);
            border: 1px solid var(--color-border-gray);
            border-radius: var(--border-radius);
            margin-bottom: var(--spacing-md);
            cursor: pointer;
            transition: all var(--transition-duration) ease;
            position: relative;
        }

        .walk-item:hover {
            border-color: var(--color-black);
            box-shadow: var(--box-shadow);
        }

        .walk-item-date {
            font-size: var(--font-size-sm);
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
        }

        .walk-item-time {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .walk-item-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
            font-size: var(--font-size-sm);
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .stat-label {
            color: var(--color-text-secondary);
            font-size: var(--font-size-xs);
        }

        .stat-value {
            font-weight: 600;
            font-size: var(--font-size-base);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: var(--spacing-md);
            color: var(--color-text-secondary);
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            stroke: var(--color-text-secondary);
            stroke-width: 1.5;
            fill: none;
        }

        /* ============================================
           ЭКРАН ЗАПИСИ ПРОГУЛКИ
           ============================================ */
        .tracking-screen {
            flex-direction: column;
            background-color: var(--color-white);
        }

        .tracking-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border-gray);
        }

        .tracking-title {
            font-size: var(--font-size-xl);
            font-weight: 700;
            margin-bottom: var(--spacing-md);
        }

        .tracking-info {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: var(--spacing-md);
        }

        .info-box {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }

        .info-label {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .info-value {
            font-size: var(--font-size-lg);
            font-weight: 700;
        }

        .tracking-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            text-align: center;
        }

        .tracking-status {
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .tracking-footer {
            padding: var(--spacing-lg);
            border-top: 1px solid var(--color-border-gray);
            display: flex;
            gap: var(--spacing-md);
        }

        .tracking-button {
            flex: 1;
            height: 48px;
            border: 2px solid var(--color-black);
            background-color: var(--color-white);
            color: var(--color-black);
            font-size: var(--font-size-base);
            font-weight: 600;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all var(--transition-duration) ease;
        }

        .tracking-button:hover:not(:disabled) {
            background-color: var(--color-black);
            color: var(--color-white);
        }

        .tracking-button.primary {
            background-color: var(--color-black);
            color: var(--color-white);
            border-color: var(--color-black);
        }

        .tracking-button.primary:hover {
            background-color: var(--color-dark-gray);
            border-color: var(--color-dark-gray);
        }

        .tracking-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ============================================
           ЭКРАН КАРТЫ
           ============================================ */
        .map-screen {
            flex-direction: column;
            background-color: var(--color-white);
        }

        #map-container {
            flex: 1;
            position: relative;
        }

        .map {
            width: 100%;
            height: 100%;
        }

        .map-controls {
            position: absolute;
            top: var(--spacing-lg);
            right: var(--spacing-lg);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            z-index: 5;
        }

        .map-control-button {
            width: 40px;
            height: 40px;
            border: 1px solid var(--color-black);
            background-color: var(--color-white);
            border-radius: var(--border-radius);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-duration) ease;
            box-shadow: var(--box-shadow);
        }

        .map-control-button:hover {
            background-color: var(--color-black);
        }

        .map-control-button svg {
            width: 20px;
            height: 20px;
            stroke: var(--color-black);
            fill: none;
            stroke-width: 2;
        }

        .map-control-button:hover svg {
            stroke: var(--color-white);
        }

        .map-header {
            padding: var(--spacing-md) var(--spacing-lg);
            border-bottom: 1px solid var(--color-border-gray);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--color-white);
        }

        .map-layer-selector {
            display: flex;
            gap: var(--spacing-sm);
        }

        .layer-button {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-border-gray);
            background-color: var(--color-white);
            color: var(--color-text-primary);
            font-size: var(--font-size-xs);
            font-weight: 600;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all var(--transition-duration) ease;
        }

        .layer-button.active {
            border-color: var(--color-black);
            background-color: var(--color-black);
            color: var(--color-white);
        }

        .layer-button:hover {
            border-color: var(--color-black);
        }

        .timeline-panel {
            background-color: var(--color-white);
            border-top: 1px solid var(--color-border-gray);
            padding: var(--spacing-lg);
            max-height: 200px;
            overflow-y: auto;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
        }

        .timeline-title {
            font-size: var(--font-size-sm);
            font-weight: 600;
        }

        .timeline-button {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-black);
            background-color: var(--color-white);
            color: var(--color-black);
            font-size: var(--font-size-xs);
            font-weight: 600;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all var(--transition-duration) ease;
        }

        .timeline-button:hover {
            background-color: var(--color-black);
            color: var(--color-white);
        }

        .timeline-controls {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }

        .timeline-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: var(--color-border-gray);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--color-black);
            border-radius: 50%;
            cursor: pointer;
        }

        .timeline-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--color-black);
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .timeline-time {
            font-size: var(--font-size-xs);
            color: var(--color-text-secondary);
            min-width: 50px;
            text-align: right;
        }

        /* ============================================
           МОДАЛЬНЫЕ ОКНА И ДИАЛОГИ
           ============================================ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--transition-duration) ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal {
            background-color: var(--color-white);
            border-radius: var(--border-radius);
            padding: var(--spacing-lg);
            max-width: 90vw;
            width: 100%;
            max-height: 90vh;
            box-shadow: var(--box-shadow-lg);
            animation: slideUp var(--transition-duration) ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            border-bottom: 1px solid var(--color-border-gray);
            padding-bottom: var(--spacing-md);
        }

        .modal-title {
            font-size: var(--font-size-lg);
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close svg {
            width: 24px;
            height: 24px;
            stroke: var(--color-black);
            stroke-width: 2;
            fill: none;
        }

        .modal-content {
            margin-bottom: var(--spacing-lg);
        }

        .modal-footer {
            display: flex;
            gap: var(--spacing-md);
            justify-content: flex-end;
        }

        .modal-button {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--color-border-gray);
            background-color: var(--color-white);
            color: var(--color-text-primary);
            font-size: var(--font-size-sm);
            font-weight: 600;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all var(--transition-duration) ease;
        }

        .modal-button:hover {
            border-color: var(--color-black);
            background-color: var(--color-light-gray);
        }

        .modal-button.danger {
            border-color: var(--color-accent-alt);
            color: var(--color-accent-alt);
        }

        .modal-button.danger:hover {
            background-color: var(--color-accent-alt);
            color: var(--color-white);
        }

        .modal-button.primary {
            background-color: var(--color-black);
            color: var(--color-white);
            border-color: var(--color-black);
        }

        .modal-button.primary:hover {
            background-color: var(--color-dark-gray);
        }

        /* ============================================
           НАСТРОЙКИ
           ============================================ */
        .settings-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .form-label {
            font-size: var(--font-size-sm);
            font-weight: 600;
        }

        .form-input,
        .form-select {
            padding: var(--spacing-md);
            border: 1px solid var(--color-border-gray);
            border-radius: var(--border-radius);
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            transition: border-color var(--transition-duration) ease;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--color-black);
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.05);
        }

        .color-picker {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all var(--transition-duration) ease;
        }

        .color-option:hover {
            border-color: var(--color-black);
            transform: scale(1.1);
        }

        .color-option.selected {
            border-color: var(--color-black);
            transform: scale(1.15);
        }

        /* ============================================
           АДАПТИВНОСТЬ (MOBILE FIRST)
           ============================================ */
        @media (max-width: 768px) {
            :root {
                --font-size-2xl: 28px;
                --font-size-xl: 20px;
                --font-size-lg: 16px;
            }

            .menu-button {
                height: 50px;
            }

            .map-layer-selector {
                overflow-x: auto;
                padding-bottom: var(--spacing-sm);
            }

            .layer-button {
                white-space: nowrap;
            }

            .timeline-panel {
                max-height: 150px;
            }

            .walk-item-stats {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            :root {
                --spacing-lg: 16px;
                --spacing-md: 12px;
                --font-size-2xl: 24px;
                --font-size-xl: 18px;
            }

            .menu-container {
                max-width: 100%;
            }

            .modal {
                max-height: 85vh;
            }

            .timeline-panel {
                max-height: 120px;
            }
        }

        /* ============================================
           СЛУЖЕБНЫЕ КЛАССЫ
           ============================================ */
        .hidden {
            display: none !important;
        }

        .text-center {
            text-align: center;
        }

        .mt {
            margin-top: var(--spacing-md);
        }

        .maplibregl-canvas {
            outline: none;
        }

        .maplibregl-popup {
            font-family: var(--font-family);
        }

        .maplibregl-popup-content {
            padding: var(--spacing-md);
            font-size: var(--font-size-sm);
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="screen menu-screen active" data-screen="menu">
            <div class="menu-container">
                <h1 class="menu-title">Walk Tracker Pro</h1>
                <button class="menu-button" id="btn-start">Начать прогулку</button>
                <button class="menu-button" id="btn-history">Предыдущие</button>
                <button class="menu-button" id="btn-settings" style="border-color: #999; color: #999;">⚙ Настройки</button>
            </div>
        </div>

        <!-- СПИСОК ПРЕДЫДУЩИХ ПРОГУЛОК -->
        <div class="screen history-screen" data-screen="history">
            <div class="header-bar">
                <h2 class="header-title">Предыдущие прогулки</h2>
                <button class="header-button" id="btn-back-history">
                    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
            </div>
            <div class="walks-list" id="walks-list">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="1"/><path d="M12 1v6M12 17v6M23 12h-6M7 12H1M20.485 3.515l-4.242 4.242M7.757 20.243l-4.242 4.242M3.515 3.515l4.242 4.242M20.243 20.243l4.242 4.242"/>
                    </svg>
                    <p>Нет сохраненных прогулок</p>
                </div>
            </div>
        </div>

        <!-- РЕЖИМ ЗАПИСИ ПРОГУЛКИ -->
        <div class="screen tracking-screen" data-screen="tracking">
            <div class="tracking-header">
                <h2 class="tracking-title">Запись прогулки</h2>
                <div class="tracking-info">
                    <div class="info-box">
                        <div class="info-label">Время</div>
                        <div class="info-value" id="tracking-time">00:00</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Дистанция</div>
                        <div class="info-value" id="tracking-distance">0.00 км</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">Скорость</div>
                        <div class="info-value" id="tracking-speed">0.0 км/ч</div>
                    </div>
                </div>
            </div>
            <div class="tracking-content">
                <div>
                    <div class="tracking-status" id="tracking-status">Инициализация GPS...</div>
                </div>
            </div>
            <div class="tracking-footer">
                <button class="tracking-button" id="btn-stop-tracking">Завершить</button>
            </div>
        </div>

        <!-- ЭКРАН КАРТЫ -->
        <div class="screen map-screen" data-screen="map">
            <div class="map-header">
                <h2 class="header-title">Маршрут прогулки</h2>
                <div class="map-layer-selector">
                    <button class="layer-button active" data-layer="osm">OSM</button>
                    <button class="layer-button" data-layer="topo">Топо</button>
                    <button class="layer-button" data-layer="satellite">Спутник</button>
                </div>
                <button class="header-button" id="btn-back-map">
                    <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                </button>
            </div>
            <div id="map-container" class="map-container">
                <div id="map" class="map"></div>
                <div class="map-controls">
                    <button class="map-control-button" id="btn-zoom-in" title="Увеличить">
                        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    </button>
                    <button class="map-control-button" id="btn-zoom-out" title="Уменьшить">
                        <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
                    </button>
                    <button class="map-control-button" id="btn-reset-view" title="Сбросить вид">
                        <svg viewBox="0 0 24 24"><path d="M1 4v6h6M23 20v-6h-6M20.49 9a9 9 0 0 0-14.85-3.36M3.51 15a9 9 0 0 0 14.85 3.36"/></svg>
                    </button>
                </div>
            </div>
            <div class="timeline-panel">
                <div class="timeline-header">
                    <div class="timeline-title">Таймлайн</div>
                    <button class="timeline-button" id="btn-timelapse">▶ Воспроизведение</button>
                </div>
                <div class="timeline-controls">
                    <input type="range" class="timeline-slider" id="timeline-slider" min="0" max="100" value="0">
                    <div class="timeline-time" id="timeline-time">00:00</div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНЫЕ ОКНА -->
    <div class="modal-overlay" id="modal-delete-walk">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Удалить прогулку?</h3>
            </div>
            <div class="modal-content">
                <p>Это действие нельзя отменить.</p>
            </div>
            <div class="modal-footer">
                <button class="modal-button" id="btn-cancel-delete">Отмена</button>
                <button class="modal-button danger" id="btn-confirm-delete">Удалить</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-settings">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Настройки</h3>
                <button class="modal-close" id="btn-close-settings">
                    <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="modal-content">
                <form class="settings-form">
                    <div class="form-group">
                        <label class="form-label">Цвет линии маршрута</label>
                        <div class="color-picker" id="color-picker">
                            <div class="color-option selected" data-color="#cc0000" style="background-color: #cc0000;" title="Красный"></div>
                            <div class="color-option" data-color="#000000" style="background-color: #000000;" title="Черный"></div>
                            <div class="color-option" data-color="#0066cc" style="background-color: #0066cc;" title="Синий"></div>
                            <div class="color-option" data-color="#00aa00" style="background-color: #00aa00;" title="Зелёный"></div>
                            <div class="color-option" data-color="#ff9900" style="background-color: #ff9900;" title="Оранжевый"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Единицы измерения</label>
                        <select class="form-select" id="units-select">
                            <option value="metric">Метрические (км, м)</option>
                            <option value="imperial">Имперские (mi, ft)</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="modal-button primary" id="btn-save-settings">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // ПРИЛОЖЕНИЕ: WALK TRACKER PRO
        // ============================================

        class WalkTrackerApp {
            constructor() {
                // Состояние приложения
                this.currentScreen = 'menu';
                this.isTracking = false;
                this.currentWalk = null;
                this.selectedWalkId = null;
                this.deleteWalkId = null;
                this.map = null;
                this.mapLayer = 'osm';
                this.routeSource = null;
                this.isTimelapseRunning = false;

                // Настройки
                this.settings = this.loadSettings();

                // Инициализация
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.loadWalks();
            }

            // ============================================
            // УПРАВЛЕНИЕ СОСТОЯНИЕМ И ЭКРАНАМИ
            // ============================================

            showScreen(screenName) {
                // Скрыть все экраны
                document.querySelectorAll('.screen').forEach(screen => {
                    screen.classList.remove('active');
                });

                // Показать нужный экран
                const screen = document.querySelector(`[data-screen="${screenName}"]`);
                if (screen) {
                    screen.classList.add('active');
                    this.currentScreen = screenName;

                    // Специальная логика для экрана карты
                    if (screenName === 'map' && !this.map) {
                        setTimeout(() => this.initializeMap(), 100);
                    }
                }
            }

            // ============================================
            // УПРАВЛЕНИЕ СОБЫТИЯМИ
            // ============================================

            setupEventListeners() {
                // Главное меню
                document.getElementById('btn-start').addEventListener('click', () => this.startTracking());
                document.getElementById('btn-history').addEventListener('click', () => this.showScreen('history'));
                document.getElementById('btn-settings').addEventListener('click', () => this.openSettings());

                // История
                document.getElementById('btn-back-history').addEventListener('click', () => this.showScreen('menu'));

                // Режим записи
                document.getElementById('btn-stop-tracking').addEventListener('click', () => this.stopTracking());

                // Карта
                document.getElementById('btn-back-map').addEventListener('click', () => this.showScreen('menu'));
                document.getElementById('btn-zoom-in').addEventListener('click', () => this.map && this.map.zoomIn());
                document.getElementById('btn-zoom-out').addEventListener('click', () => this.map && this.map.zoomOut());
                document.getElementById('btn-reset-view').addEventListener('click', () => this.resetMapView());
                document.getElementById('btn-timelapse').addEventListener('click', () => this.toggleTimelapse());
                document.getElementById('timeline-slider').addEventListener('input', (e) => this.seekTimeline(e));

                // Слои карты
                document.querySelectorAll('.layer-button').forEach(btn => {
                    btn.addEventListener('click', (e) => this.switchMapLayer(e.target.dataset.layer));
                });

                // Модали
                document.getElementById('btn-cancel-delete').addEventListener('click', () => this.closeModal('modal-delete-walk'));
                document.getElementById('btn-confirm-delete').addEventListener('click', () => this.confirmDelete());
                document.getElementById('btn-close-settings').addEventListener('click', () => this.closeModal('modal-settings'));
                document.getElementById('btn-save-settings').addEventListener('click', () => this.saveSettings());

                // Настройки
                document.querySelectorAll('.color-option').forEach(option => {
                    option.addEventListener('click', (e) => this.selectColor(e.target));
                });

                // Делегирование для списка прогулок
                document.getElementById('walks-list').addEventListener('click', (e) => {
                    const walkItem = e.target.closest('.walk-item');
                    if (walkItem) {
                        const walkId = walkItem.dataset.walkId;
                        this.selectedWalkId = walkId;
                        this.showWalkOnMap(walkId);
                    }
                });

                document.getElementById('walks-list').addEventListener('contextmenu', (e) => {
                    const walkItem = e.target.closest('.walk-item');
                    if (walkItem) {
                        e.preventDefault();
                        this.deleteWalkId = walkItem.dataset.walkId;
                        this.openModal('modal-delete-walk');
                    }
                });

                // Long press для удаления
                document.getElementById('walks-list').addEventListener('touchstart', (e) => {
                    const walkItem = e.target.closest('.walk-item');
                    if (walkItem) {
                        this.longPressTimer = setTimeout(() => {
                            this.deleteWalkId = walkItem.dataset.walkId;
                            this.openModal('modal-delete-walk');
                        }, 500);
                    }
                });

                document.getElementById('walks-list').addEventListener('touchend', () => {
                    clearTimeout(this.longPressTimer);
                });
            }

            // ============================================
            // ТРЕКИНГ ПРОГУЛОК
            // ============================================

            startTracking() {
                if (!navigator.geolocation) {
                    alert('Геолокация недоступна на этом устройстве');
                    return;
                }

                this.isTracking = true;
                this.currentWalk = {
                    id: Date.now().toString(),
                    startTime: Date.now(),
                    points: [],
                    timestamps: []
                };

                this.showScreen('tracking');
                this.updateTrackingDisplay();

                // Запрос геолокации
                navigator.geolocation.watchPosition(
                    (position) => this.handleGeolocationSuccess(position),
                    (error) => this.handleGeolocationError(error),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );

                // Обновление дисплея каждую секунду
                this.trackingInterval = setInterval(() => this.updateTrackingDisplay(), 1000);
            }

            handleGeolocationSuccess(position) {
                const { latitude, longitude } = position.coords;
                const speed = position.coords.speed || 0;

                const point = { lat: latitude, lng: longitude, speed };
                this.currentWalk.points.push(point);
                this.currentWalk.timestamps.push(Date.now());

                const status = `GPS: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
                document.getElementById('tracking-status').textContent = status;
            }

            handleGeolocationError(error) {
                const messages = {
                    1: 'Доступ запрещен. Разрешите геолокацию.',
                    2: 'Позиция не найдена. Находитесь на открытом воздухе.',
                    3: 'Истёк timeout. Проверьте сигнал GPS.'
                };
                document.getElementById('tracking-status').textContent = messages[error.code] || 'Ошибка GPS';
            }

            updateTrackingDisplay() {
                if (!this.currentWalk) return;

                const elapsedMs = Date.now() - this.currentWalk.startTime;
                const distance = this.calculateDistance(this.currentWalk.points);
                const speed = this.calculateCurrentSpeed(this.currentWalk.points);

                // Время
                const hours = Math.floor(elapsedMs / 3600000);
                const minutes = Math.floor((elapsedMs % 3600000) / 60000);
                const seconds = Math.floor((elapsedMs % 60000) / 1000);
                const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                // Дистанция
                const distStr = this.settings.units === 'metric'
                    ? distance >= 1 ? `${distance.toFixed(2)} км` : `${(distance * 1000).toFixed(0)} м`
                    : distance >= 0.621 ? `${(distance * 0.621371).toFixed(2)} mi` : `${(distance * 1000 * 3.28084).toFixed(0)} ft`;

                // Скорость
                const speedStr = this.settings.units === 'metric'
                    ? `${speed.toFixed(1)} км/ч`
                    : `${(speed * 0.621371).toFixed(1)} mph`;

                document.getElementById('tracking-time').textContent = timeStr;
                document.getElementById('tracking-distance').textContent = distStr;
                document.getElementById('tracking-speed').textContent = speedStr;
            }

            stopTracking() {
                this.isTracking = false;
                clearInterval(this.trackingInterval);

                if (this.currentWalk && this.currentWalk.points.length > 0) {
                    const walk = this.finalizeWalk();
                    this.saveWalk(walk);
                    this.selectedWalkId = walk.id;
                    this.showScreen('map');
                    setTimeout(() => this.initializeMap(), 100);
                } else {
                    alert('Нет данных для сохранения');
                    this.showScreen('menu');
                }
            }

            finalizeWalk() {
                const endTime = Date.now();
                const duration = endTime - this.currentWalk.startTime;
                const distance = this.calculateDistance(this.currentWalk.points);
                const avgSpeed = distance > 0 ? (distance / (duration / 3600000)) : 0;

                return {
                    id: this.currentWalk.id,
                    startTime: this.currentWalk.startTime,
                    endTime: endTime,
                    points: this.currentWalk.points,
                    timestamps: this.currentWalk.timestamps,
                    distance: distance,
                    duration: duration,
                    avgSpeed: avgSpeed
                };
            }

            // ============================================
            // РАСЧЕТЫ
            // ============================================

            calculateDistance(points) {
                if (points.length < 2) return 0;

                let distance = 0;
                for (let i = 1; i < points.length; i++) {
                    distance += this.haversineDistance(points[i - 1], points[i]);
                }
                return distance;
            }

            calculateCurrentSpeed(points) {
                if (points.length < 2) return 0;
                const last = points[points.length - 1];
                return last.speed || 0;
            }

            haversineDistance(point1, point2) {
                const R = 6371; // км
                const dLat = (point2.lat - point1.lat) * Math.PI / 180;
                const dLng = (point2.lng - point1.lng) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(point1.lat * Math.PI / 180) * Math.cos(point2.lat * Math.PI / 180) *
                    Math.sin(dLng / 2) * Math.sin(dLng / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            // ============================================
            // УПРАВЛЕНИЕ ПРОГУЛКАМИ
            // ============================================

            saveWalk(walk) {
                const walks = this.loadWalksData();
                walks.push(walk);
                localStorage.setItem('walks', JSON.stringify(walks));
            }

            loadWalks() {
                const walks = this.loadWalksData();
                this.renderWalksList(walks);
            }

            loadWalksData() {
                try {
                    return JSON.parse(localStorage.getItem('walks')) || [];
                } catch {
                    return [];
                }
            }

            renderWalksList(walks) {
                const list = document.getElementById('walks-list');

                if (walks.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="1"/><path d="M12 1v6M12 17v6M23 12h-6M7 12H1M20.485 3.515l-4.242 4.242M7.757 20.243l-4.242 4.242M3.515 3.515l4.242 4.242M20.243 20.243l4.242 4.242"/>
                            </svg>
                            <p>Нет сохраненных прогулок</p>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = walks.map(walk => {
                    const startDate = new Date(walk.startTime);
                    const endDate = new Date(walk.endTime);
                    const dateStr = startDate.toLocaleDateString('ru-RU');
                    const startTimeStr = startDate.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    const endTimeStr = endDate.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

                    const distStr = this.settings.units === 'metric'
                        ? walk.distance >= 1 ? `${walk.distance.toFixed(2)} км` : `${(walk.distance * 1000).toFixed(0)} м`
                        : walk.distance >= 0.621 ? `${(walk.distance * 0.621371).toFixed(2)} mi` : `${(walk.distance * 1000 * 3.28084).toFixed(0)} ft`;

                    const speedStr = this.settings.units === 'metric'
                        ? `${walk.avgSpeed.toFixed(1)} км/ч`
                        : `${(walk.avgSpeed * 0.621371).toFixed(1)} mph`;

                    return `
                        <div class="walk-item" data-walk-id="${walk.id}">
                            <div class="walk-item-date">${dateStr}</div>
                            <div class="walk-item-time">${startTimeStr} — ${endTimeStr}</div>
                            <div class="walk-item-stats">
                                <div class="stat">
                                    <span class="stat-label">Дистанция</span>
                                    <span class="stat-value">${distStr}</span>
                                </div>
                                <div class="stat">
                                    <span class="stat-label">Средняя скорость</span>
                                    <span class="stat-value">${speedStr}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            deleteWalk(walkId) {
                let walks = this.loadWalksData();
                walks = walks.filter(w => w.id !== walkId);
                localStorage.setItem('walks', JSON.stringify(walks));
                this.loadWalks();
            }

            confirmDelete() {
                if (this.deleteWalkId) {
                    this.deleteWalk(this.deleteWalkId);
                    this.closeModal('modal-delete-walk');
                    this.deleteWalkId = null;
                }
            }

            // ============================================
            // КАРТА И ТАЙМЛАЙН
            // ============================================

            initializeMap() {
                if (this.map) return;

                const mapElement = document.getElementById('map');
                if (!mapElement) return;

                // Получить прогулку
                const walks = this.loadWalksData();
                const walk = walks.find(w => w.id === this.selectedWalkId);
                if (!walk || !walk.points.length) return;

                // Вычислить центр и границы
                const bounds = this.calculateBounds(walk.points);
                const center = [(bounds.minLng + bounds.maxLng) / 2, (bounds.minLat + bounds.maxLat) / 2];

                // Инициализировать карту
                this.map = new maplibregl.Map({
                    container: 'map',
                    style: this.getMapStyle('osm'),
                    center: center,
                    zoom: 14,
                    pitch: 0,
                    bearing: 0
                });

                this.map.on('load', () => {
                    this.addRouteToMap(walk);
                });
            }

            getMapStyle(layer) {
                const styles = {
                    osm: 'https://demotiles.maplibre.org/style.json',
                    topo: {
                        version: 8,
                        sources: {
                            osm: {
                                type: 'raster',
                                tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                                tileSize: 256
                            }
                        },
                        layers: [
                            {
                                id: 'osm',
                                type: 'raster',
                                source: 'osm'
                            }
                        ]
                    },
                    satellite: {
                        version: 8,
                        sources: {
                            satellite: {
                                type: 'raster',
                                tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                                tileSize: 256
                            }
                        },
                        layers: [
                            {
                                id: 'satellite',
                                type: 'raster',
                                source: 'satellite'
                            }
                        ]
                    }
                };

                return styles[layer] || styles.osm;
            }

            addRouteToMap(walk) {
                const geojson = {
                    type: 'FeatureCollection',
                    features: [
                        {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: walk.points.map(p => [p.lng, p.lat])
                            }
                        }
                    ]
                };

                // Добавить источник
                if (!this.map.getSource('route')) {
                    this.map.addSource('route', {
                        type: 'geojson',
                        data: geojson
                    });

                    this.map.addLayer({
                        id: 'route-line',
                        type: 'line',
                        source: 'route',
                        paint: {
                            'line-color': this.settings.routeColor,
                            'line-width': 3,
                            'line-opacity': 0.8
                        }
                    });

                    // Маркеры начала и конца
                    this.map.addSource('route-points', {
                        type: 'geojson',
                        data: {
                            type: 'FeatureCollection',
                            features: [
                                {
                                    type: 'Feature',
                                    properties: { type: 'start' },
                                    geometry: {
                                        type: 'Point',
                                        coordinates: [walk.points[0].lng, walk.points[0].lat]
                                    }
                                },
                                {
                                    type: 'Feature',
                                    properties: { type: 'end' },
                                    geometry: {
                                        type: 'Point',
                                        coordinates: [walk.points[walk.points.length - 1].lng, walk.points[walk.points.length - 1].lat]
                                    }
                                }
                            ]
                        }
                    });

                    this.map.addLayer({
                        id: 'route-points',
                        type: 'circle',
                        source: 'route-points',
                        paint: {
                            'circle-radius': 6,
                            'circle-color': '#000000',
                            'circle-stroke-width': 2,
                            'circle-stroke-color': '#ffffff'
                        }
                    });
                }

                // Обновить таймлайн
                this.updateTimeline(walk);

                // Zoom на маршрут
                this.zoomToRoute(walk);

                this.routeSource = 'route';
            }

            switchMapLayer(layer) {
                if (!this.map) return;

                // Обновить активную кнопку
                document.querySelectorAll('.layer-button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.layer === layer);
                });

                this.mapLayer = layer;
                this.map.setStyle(this.getMapStyle(layer));

                // Переинициализировать маршрут
                this.map.on('styledata', () => {
                    const walks = this.loadWalksData();
                    const walk = walks.find(w => w.id === this.selectedWalkId);
                    if (walk) {
                        this.addRouteToMap(walk);
                    }
                }, { once: true });
            }

            zoomToRoute(walk) {
                const bounds = this.calculateBounds(walk.points);
                this.map.fitBounds(
                    [[bounds.minLng, bounds.minLat], [bounds.maxLng, bounds.maxLat]],
                    { padding: 50 }
                );
            }

            resetMapView() {
                if (this.map && this.selectedWalkId) {
                    const walks = this.loadWalksData();
                    const walk = walks.find(w => w.id === this.selectedWalkId);
                    if (walk) {
                        this.zoomToRoute(walk);
                    }
                }
            }

            calculateBounds(points) {
                let minLat = Infinity, maxLat = -Infinity;
                let minLng = Infinity, maxLng = -Infinity;

                points.forEach(p => {
                    minLat = Math.min(minLat, p.lat);
                    maxLat = Math.max(maxLat, p.lat);
                    minLng = Math.min(minLng, p.lng);
                    maxLng = Math.max(maxLng, p.lng);
                });

                return { minLat, maxLat, minLng, maxLng };
            }

            // ============================================
            // ТАЙМЛАЙН
            // ============================================

            updateTimeline(walk) {
                const slider = document.getElementById('timeline-slider');
                slider.max = walk.timestamps.length - 1;
                slider.value = walk.timestamps.length - 1;
                this.updateTimelineDisplay(walk);
            }

            seekTimeline(e) {
                if (!this.selectedWalkId) return;

                const walks = this.loadWalksData();
                const walk = walks.find(w => w.id === this.selectedWalkId);
                if (!walk) return;

                const index = parseInt(e.target.value);
                this.updateTimelineDisplay(walk, index);
                this.updateRoutePreview(walk, index);
            }

            updateTimelineDisplay(walk, index = null) {
                if (index === null) index = walk.timestamps.length - 1;

                const timeMs = walk.timestamps[index] - walk.timestamps[0];
                const hours = Math.floor(timeMs / 3600000);
                const minutes = Math.floor((timeMs % 3600000) / 60000);
                const seconds = Math.floor((timeMs % 60000) / 1000);
                const timeStr = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                document.getElementById('timeline-time').textContent = timeStr;
            }

            updateRoutePreview(walk, index) {
                if (!this.map || !this.map.getSource('route')) return;

                const visiblePoints = walk.points.slice(0, index + 1);
                const geojson = {
                    type: 'FeatureCollection',
                    features: [
                        {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: visiblePoints.map(p => [p.lng, p.lat])
                            }
                        }
                    ]
                };

                this.map.getSource('route').setData(geojson);
            }

            toggleTimelapse() {
                if (!this.selectedWalkId) return;

                const walks = this.loadWalksData();
                const walk = walks.find(w => w.id === this.selectedWalkId);
                if (!walk) return;

                this.isTimelapseRunning = !this.isTimelapseRunning;
                const btn = document.getElementById('btn-timelapse');
                btn.textContent = this.isTimelapseRunning ? '⏸ Пауза' : '▶ Воспроизведение';

                if (this.isTimelapseRunning) {
                    this.runTimelapse(walk);
                }
            }

            runTimelapse(walk) {
                let index = 0;
                const slider = document.getElementById('timeline-slider');

                const interval = setInterval(() => {
                    if (!this.isTimelapseRunning) {
                        clearInterval(interval);
                        return;
                    }

                    index++;
                    if (index > walk.timestamps.length - 1) {
                        this.isTimelapseRunning = false;
                        document.getElementById('btn-timelapse').textContent = '▶ Воспроизведение';
                        clearInterval(interval);
                        return;
                    }

                    slider.value = index;
                    this.updateTimelineDisplay(walk, index);
                    this.updateRoutePreview(walk, index);
                }, 100);
            }

            // ============================================
            // МОДАЛИ И НАСТРОЙКИ
            // ============================================

            openModal(id) {
                document.getElementById(id).classList.add('active');
            }

            closeModal(id) {
                document.getElementById(id).classList.remove('active');
            }

            openSettings() {
                this.openModal('modal-settings');
            }

            loadSettings() {
                try {
                    return JSON.parse(localStorage.getItem('settings')) || {
                        routeColor: '#cc0000',
                        units: 'metric'
                    };
                } catch {
                    return { routeColor: '#cc0000', units: 'metric' };
                }
            }

            selectColor(element) {
                document.querySelectorAll('.color-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                element.classList.add('selected');
                this.settings.routeColor = element.dataset.color;
            }

            saveSettings() {
                const units = document.getElementById('units-select').value;
                this.settings.units = units;

                localStorage.setItem('settings', JSON.stringify(this.settings));
                this.closeModal('modal-settings');
                this.loadWalks(); // Обновить список с новыми единицами

                // Обновить цвет маршрута на карте
                if (this.map && this.map.getLayer('route-line')) {
                    this.map.setPaintProperty('route-line', 'line-color', this.settings.routeColor);
                }
            }

            showWalkOnMap(walkId) {
                this.selectedWalkId = walkId;
                this.showScreen('map');
                setTimeout(() => this.initializeMap(), 100);
            }
        }

        // ============================================
        // ИНИЦИАЛИЗАЦИЯ ПРИЛОЖЕНИЯ
        // ============================================

        const app = new WalkTrackerApp();
    </script>
</body>
</html>
