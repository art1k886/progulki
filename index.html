<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Path / Track Pro Precision</title>

    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <script>
        window.appConfig = {
            sensors: {
                useAccelerometer: false,
                gpsMinDistanceMeter: 1.5,
                gpsMaxAccuracyMeter: 45.0,
                smoothAlpha: 0.35
            },
            ui: {
                theme: 'dark',
                defaultLayer: 'osm'
            },
            tracks: {
                lineWidth: 5,
                lineOutlineWidth: 8,
                colors: {
                    dark: {
                        osm: { line: '#ffffff', stroke: '#000000', point: '#ffffff' },
                        topo: { line: '#ff3b30', stroke: '#ffffff', point: '#ff3b30' },
                        sat: { line: '#00f0ff', stroke: '#000000', point: '#00f0ff' }
                    },
                    light: {
                        osm: { line: '#000000', stroke: '#ffffff', point: '#000000' },
                        topo: { line: '#d90429', stroke: '#ffffff', point: '#d90429' },
                        sat: { line: '#0055ff', stroke: '#ffffff', point: '#0055ff' }
                    }
                }
            }
        };
    </script>

    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1f1f1f;
            --border-color: #2e2e2e;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --danger-color: #e53935;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition-speed: 0.2s;
        }

        body.theme-light {
            --bg-primary: #f4f4f6;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e5e5ea;
            --border-color: #d1d1d6;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family);
            overflow: hidden;
            user-select: none;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        .app-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.98);
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease, visibility var(--transition-speed);
            z-index: 1;
            background-color: var(--bg-primary);
        }

        .app-screen.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            z-index: 10;
        }

        .header {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-secondary);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .btn-primary {
            width: 100%;
            padding: 18px 24px;
            background-color: var(--text-primary);
            color: var(--bg-primary);
            border: 1px solid var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-secondary {
            width: 100%;
            padding: 18px 24px;
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        #screen-menu {
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .menu-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brand-logo {
            margin-bottom: 40px;
            text-align: center;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            margin-top: 6px;
            text-transform: uppercase;
        }

        .settings-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
        }

        .setting-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .setting-label {
            font-size: 13px;
        }

        .setting-select, .setting-input {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 12px;
            outline: none;
        }

        .walk-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .walk-item {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .walk-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .walk-date {
            font-size: 14px;
            font-weight: 600;
        }

        .walk-metrics {
            display: flex;
            gap: 24px;
        }

        .metric-group {
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 13px;
            font-weight: 500;
            margin-top: 2px;
        }

        #tracking-map-container, #map-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay-top {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
        }

        .overlay-top > * {
            pointer-events: auto;
        }

        .tracking-badge {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pulse-indicator {
            width: 10px;
            height: 10px;
            background-color: var(--danger-color);
            border-radius: 50%;
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.4; }
        }

        .tracking-timer {
            font-size: 18px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .overlay-bottom {
            position: absolute;
            bottom: 24px;
            left: 16px;
            right: 16px;
            z-index: 10;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .live-metrics {
            display: flex;
            justify-content: space-around;
        }

        .map-controls-group {
            display: flex;
            gap: 4px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 4px;
        }

        .layer-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
        }

        .layer-btn.active {
            color: var(--bg-primary);
            background-color: var(--text-primary);
        }

        .timeline-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .slider-container {
            flex: 1;
            display: flex;
            align-items: center;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: var(--bg-tertiary);
            height: 4px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--text-primary);
            cursor: pointer;
        }

        .time-display {
            font-size: 12px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            width: 50px;
            text-align: right;
        }

        .monochrome-map .maplibregl-canvas {
            filter: grayscale(100%) invert(90%) contrast(120%);
        }

        body.theme-light .monochrome-map .maplibregl-canvas {
            filter: grayscale(100%) contrast(110%);
        }

        .user-location-marker {
            width: 20px;
            height: 20px;
            background-color: #007aff;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,122,255,0.8);
            position: relative;
        }

        .user-location-marker::after {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: rgba(0, 122, 255, 0.3);
            animation: user-pulse 2s infinite ease-out;
        }

        @keyframes user-pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }
    </style>
</head>
<body>

    <section id="screen-menu" class="app-screen active">
        <div class="brand-logo">
            <div class="brand-title">PATH / TRACK</div>
            <div class="brand-subtitle">Гибридный Навигатор</div>
        </div>
        <div class="menu-container">
            <button class="btn-primary" onclick="window.app.requestAndStartTracking()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Начать Прогулку
            </button>
            <button class="btn-secondary" onclick="window.app.showScreen('screen-history')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                История
            </button>
            <button class="btn-secondary" onclick="window.app.showScreen('screen-settings')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Настройки
            </button>
        </div>
    </section>

    <section id="screen-settings" class="app-screen">
        <div class="header">
            <button class="btn-icon" onclick="window.app.showScreen('screen-menu')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <div class="header-title">Параметры</div>
            <div style="width: 40px;"></div>
        </div>
        <div class="settings-content">
            <div class="setting-group">
                <div class="setting-title">Интерфейс</div>
                <div class="setting-row">
                    <span class="setting-label">Тема оформления</span>
                    <select class="setting-select" id="setting-theme" onchange="window.app.changeTheme(this.value)">
                        <option value="dark">Темная (Ночь)</option>
                        <option value="light">Светлая (День)</option>
                    </select>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-title">Точность и Движение</div>
                <div class="setting-row">
                    <span class="setting-label">Плавность треков (Alpha)</span>
                    <select class="setting-select" id="setting-smooth" onchange="window.app.updateConfig('sensors.smoothAlpha', parseFloat(this.value))">
                        <option value="0.2">Высокая гладкость (0.2)</option>
                        <option value="0.35" selected>Оптимальное сглаживание (0.35)</option>
                        <option value="0.6">Минимальное сглаживание (0.6)</option>
                        <option value="1.0">Без сглаживания (Сырой GPS)</option>
                    </select>
                </div>
                <div class="setting-row">
                    <span class="setting-label">Мин. шаг записи (метры)</span>
                    <input type="number" class="setting-input" id="setting-min-dist" step="0.5" value="1.5" style="width: 70px;" onchange="window.app.updateConfig('sensors.gpsMinDistanceMeter', parseFloat(this.value))">
                </div>
                <div class="setting-row">
                    <span class="setting-label">Макс. погрешность GPS (м)</span>
                    <input type="number" class="setting-input" id="setting-max-acc" step="1" value="45" style="width: 70px;" onchange="window.app.updateConfig('sensors.gpsMaxAccuracyMeter', parseFloat(this.value))">
                </div>
            </div>
        </div>
    </section>

    <section id="screen-history" class="app-screen">
        <div class="header">
            <button class="btn-icon" onclick="window.app.showScreen('screen-menu')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <div class="header-title">История Прогулок</div>
            <div style="width: 40px;"></div>
        </div>
        <div class="walk-list" id="history-container"></div>
    </section>

    <section id="screen-tracking" class="app-screen">
        <div id="tracking-map-container"></div>

        <div class="overlay-top">
            <div class="tracking-badge">
                <div class="pulse-indicator"></div>
                <div class="tracking-timer" id="tracking-timer">00:00:00</div>
            </div>
            <div class="map-controls-group">
                <button class="layer-btn active" id="btn-tr-layer-osm" onclick="window.app.setTrackingMapLayer('osm')">Mono</button>
                <button class="layer-btn" id="btn-tr-layer-topo" onclick="window.app.setTrackingMapLayer('topo')">Topo</button>
                <button class="layer-btn" id="btn-tr-layer-sat" onclick="window.app.setTrackingMapLayer('sat')">Sat</button>
            </div>
        </div>

        <div class="overlay-bottom">
            <div class="live-metrics">
                <div class="metric-group">
                    <span class="metric-label">Дистанция</span>
                    <span class="metric-value" id="live-distance">0.00 км</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">Статус</span>
                    <span class="metric-value" id="live-status">Поиск GPS...</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">Точность GPS</span>
                    <span class="metric-value" id="live-accuracy">±0м</span>
                </div>
            </div>
            <button class="btn-primary" style="border-color: var(--danger-color); background-color: var(--danger-color); color: #fff;" onclick="window.app.stopTracking()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12"></rect></svg>
                Завершить
            </button>
        </div>
    </section>

    <section id="screen-map" class="app-screen">
        <div id="map-container"></div>

        <div class="overlay-top">
            <button class="btn-icon" style="background-color: var(--bg-secondary); border: 1px solid var(--border-color);" onclick="window.app.showScreen('screen-history')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <div class="map-controls-group">
                <button class="layer-btn active" id="btn-layer-osm" onclick="window.app.setMapLayer('osm')">Mono</button>
                <button class="layer-btn" id="btn-layer-topo" onclick="window.app.setMapLayer('topo')">Topo</button>
                <button class="layer-btn" id="btn-layer-sat" onclick="window.app.setMapLayer('sat')">Sat</button>
            </div>
        </div>

        <div class="overlay-bottom">
            <div class="walk-metrics" style="justify-content: space-between;">
                <div class="metric-group">
                    <span class="metric-label" id="map-date-label">Дата</span>
                    <span class="metric-value" id="map-metrics-dist">0 км</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">Ср. Скорость</span>
                    <span class="metric-value" id="map-metrics-speed">0 км/ч</span>
                </div>
                <div class="metric-group">
                    <span class="metric-label">Время</span>
                    <span class="metric-value" id="map-metrics-time">00:00</span>
                </div>
            </div>

            <div class="timeline-controls">
                <div class="slider-container">
                    <input type="range" id="timeline-slider" min="0" max="100" value="100" oninput="window.app.onTimelineInput(this.value)">
                </div>
                <div class="time-display" id="timeline-time">00:00</div>
            </div>
        </div>
    </section>

    <script>
        class RouteTrackerApp {
            constructor() {
                this.cfg = window.appConfig;
                this.storageKey = 'path_tracker_walks';
                this.walks = this.loadWalks();

                this.watchId = null;
                this.currentTrack = [];
                this.startTime = null;
                this.timerInterval = null;

                this.map = null;
                this.trackingMap = null;
                this.liveMarker = null;
                this.selectedWalk = null;

                this.lastFilteredPos = null;
                this.activeLayer = this.cfg.ui.defaultLayer || 'osm';

                this.initMaps();
                this.applyTheme(this.cfg.ui.theme || 'dark');
            }

            loadWalks() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    return [];
                }
            }

            saveWalks() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.walks));
                } catch (e) {
                    console.error('Ошибка сохранения:', e);
                }
            }

            deleteWalk(id, event) {
                if (event) event.stopPropagation();
                if (confirm('Удалить эту прогулку из истории?')) {
                    this.walks = this.walks.filter(w => w.id !== id);
                    this.saveWalks();
                    this.renderHistory();
                }
            }

            updateConfig(path, value) {
                const keys = path.split('.');
                let obj = this.cfg;
                for (let i = 0; i < keys.length - 1; i++) {
                    obj = obj[keys[i]];
                }
                obj[keys[keys.length - 1]] = value;
            }

            applyTheme(theme) {
                this.cfg.ui.theme = theme;
                document.body.className = theme === 'light' ? 'theme-light' : '';
                const themeSelect = document.getElementById('setting-theme');
                if (themeSelect) themeSelect.value = theme;

                if (this.map) this.applyLayerToMap(this.map, 'map-container', this.activeLayer, 'btn-layer', 'route-layer', 'point-layer');
                if (this.trackingMap) this.applyLayerToMap(this.trackingMap, 'tracking-map-container', this.activeLayer, 'btn-tr-layer', 'live-route-layer');
            }

            changeTheme(val) {
                this.applyTheme(val);
            }

            showScreen(screenId) {
                document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById(screenId);
                if (target) target.classList.add('active');

                if (screenId === 'screen-history') {
                    this.renderHistory();
                } else if (screenId === 'screen-map') {
                    setTimeout(() => { if (this.map) this.map.resize(); }, 200);
                } else if (screenId === 'screen-tracking') {
                    setTimeout(() => { if (this.trackingMap) this.trackingMap.resize(); }, 200);
                }
            }

            getMapStyleSources() {
                return {
                    'osm-tiles': {
                        type: 'raster',
                        tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        tileSize: 256
                    },
                    'google-topo-tiles': {
                        type: 'raster',
                        tiles: ['https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}'],
                        tileSize: 256
                    },
                    'google-sat-tiles': {
                        type: 'raster',
                        tiles: ['https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}'],
                        tileSize: 256
                    }
                };
            }

            getMapStyleLayers() {
                return [
                    { id: 'layer-sat', type: 'raster', source: 'google-sat-tiles', layout: { visibility: 'none' } },
                    { id: 'layer-topo', type: 'raster', source: 'google-topo-tiles', layout: { visibility: 'none' } },
                    { id: 'layer-osm', type: 'raster', source: 'osm-tiles', layout: { visibility: 'visible' } }
                ];
            }

            initMaps() {
                this.map = new maplibregl.Map({
                    container: 'map-container',
                    style: { version: 8, sources: this.getMapStyleSources(), layers: this.getMapStyleLayers() },
                    center: [30.5234, 50.4501],
                    zoom: 12
                });

                this.map.on('load', () => {
                    this.map.addSource('route-source', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
                    this.map.addLayer({
                        id: 'route-layer-outline',
                        type: 'line',
                        source: 'route-source',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#000000', 'line-width': this.cfg.tracks.lineOutlineWidth }
                    });
                    this.map.addLayer({
                        id: 'route-layer',
                        type: 'line',
                        source: 'route-source',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#ffffff', 'line-width': this.cfg.tracks.lineWidth }
                    });

                    this.map.addSource('point-source', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0, 0] } } });
                    this.map.addLayer({
                        id: 'point-layer',
                        type: 'circle',
                        source: 'point-source',
                        paint: { 'circle-radius': 7, 'circle-color': '#ffffff', 'circle-stroke-width': 3, 'circle-stroke-color': '#000000' }
                    });
                });

                this.trackingMap = new maplibregl.Map({
                    container: 'tracking-map-container',
                    style: { version: 8, sources: this.getMapStyleSources(), layers: this.getMapStyleLayers() },
                    center: [30.5234, 50.4501],
                    zoom: 17
                });

                this.trackingMap.on('load', () => {
                    this.trackingMap.addSource('live-route-source', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: [] } } });
                    this.trackingMap.addLayer({
                        id: 'live-route-layer-outline',
                        type: 'line',
                        source: 'live-route-source',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#000000', 'line-width': this.cfg.tracks.lineOutlineWidth }
                    });
                    this.trackingMap.addLayer({
                        id: 'live-route-layer',
                        type: 'line',
                        source: 'live-route-source',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#ffffff', 'line-width': this.cfg.tracks.lineWidth }
                    });

                    const el = document.createElement('div');
                    el.className = 'user-location-marker';
                    this.liveMarker = new maplibregl.Marker({ element: el })
                        .setLngLat([0, 0])
                        .addTo(this.trackingMap);
                });
            }

            requestAndStartTracking() {
                if (!navigator.geolocation) {
                    alert('Геолокация не поддерживается вашим устройством.');
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => this.startTracking(pos),
                    (err) => alert('Разрешите доступ к геолокации в настройках браузера.'),
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }

            startTracking(initialPos) {
                this.currentTrack = [];
                this.lastFilteredPos = null;
                this.startTime = new Date();

                this.showScreen('screen-tracking');

                if (initialPos) this.onLocationUpdate(initialPos);

                this.timerInterval = setInterval(() => this.updateTimer(), 1000);

                this.watchId = navigator.geolocation.watchPosition(
                    (pos) => this.onLocationUpdate(pos),
                    (err) => console.warn(err),
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }

            onLocationUpdate(pos) {
                const accuracy = pos.coords.accuracy;
                document.getElementById('live-accuracy').innerText = `±${Math.round(accuracy)}м`;

                const statusEl = document.getElementById('live-status');

                if (accuracy > this.cfg.sensors.gpsMaxAccuracyMeter) {
                    statusEl.innerText = 'Слабый GPS';
                    statusEl.style.color = '#ff9800';
                    return;
                }

                statusEl.innerText = 'Запись...';
                statusEl.style.color = '#4caf50';

                const rawLat = pos.coords.latitude;
                const rawLng = pos.coords.longitude;
                const timestamp = new Date().getTime();

                if (!this.lastFilteredPos) {
                    this.lastFilteredPos = { lat: rawLat, lng: rawLng };
                    this.currentTrack.push({ lat: rawLat, lng: rawLng, timestamp });
                    this.updateLiveMap();
                    return;
                }

                const distFromLast = this.haversineDistance(this.lastFilteredPos, { lat: rawLat, lng: rawLng });

                if (distFromLast < this.cfg.sensors.gpsMinDistanceMeter) return;

                const alpha = this.cfg.sensors.smoothAlpha;
                const smoothLat = this.lastFilteredPos.lat + alpha * (rawLat - this.lastFilteredPos.lat);
                const smoothLng = this.lastFilteredPos.lng + alpha * (rawLng - this.lastFilteredPos.lng);

                this.lastFilteredPos = { lat: smoothLat, lng: smoothLng };
                this.currentTrack.push({ lat: smoothLat, lng: smoothLng, timestamp });

                this.updateLiveMetrics();
                this.updateLiveMap();
            }

            updateLiveMap() {
                if (!this.trackingMap || this.currentTrack.length === 0) return;

                const coords = this.currentTrack.map(p => [p.lng, p.lat]);
                const lastCoord = coords[coords.length - 1];

                if (this.trackingMap.getSource('live-route-source')) {
                    this.trackingMap.getSource('live-route-source').setData({
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: coords }
                    });
                }

                if (this.liveMarker) {
                    this.liveMarker.setLngLat(lastCoord);
                }

                this.trackingMap.easeTo({ center: lastCoord, zoom: 17.5, duration: 300 });
            }

            updateTimer() {
                const elapsedSec = Math.floor((new Date() - this.startTime) / 1000);
                const hrs = String(Math.floor(elapsedSec / 3600)).padStart(2, '0');
                const mins = String(Math.floor((elapsedSec % 3600) / 60)).padStart(2, '0');
                const secs = String(elapsedSec % 60).padStart(2, '0');
                document.getElementById('tracking-timer').innerText = `${hrs}:${mins}:${secs}`;
            }

            updateLiveMetrics() {
                const distMeters = this.calculateDistance(this.currentTrack);
                const distKm = (distMeters / 1000).toFixed(2);
                document.getElementById('live-distance').innerText = `${distKm} км`;
            }

            stopTracking() {
                if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
                clearInterval(this.timerInterval);

                if (this.currentTrack.length < 2) {
                    alert('Недостаточно точек для записи трека.');
                    this.showScreen('screen-menu');
                    return;
                }

                const endTime = new Date();
                const totalDistMeters = this.calculateDistance(this.currentTrack);
                const durationHours = Math.max((endTime - this.startTime) / 1000 / 3600, 0.0001);
                const avgSpeed = ((totalDistMeters / 1000) / durationHours).toFixed(1);

                const newWalk = {
                    id: Date.now().toString(),
                    startTime: this.startTime.toISOString(),
                    endTime: endTime.toISOString(),
                    distance: totalDistMeters,
                    avgSpeed: parseFloat(avgSpeed),
                    track: this.currentTrack
                };

                this.walks.unshift(newWalk);
                this.saveWalks();

                this.openWalkOnMap(newWalk.id);
            }

            renderHistory() {
                const container = document.getElementById('history-container');
                container.innerHTML = '';

                if (this.walks.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); margin-top:40px;">Нет сохраненных прогулок</div>';
                    return;
                }

                this.walks.forEach(walk => {
                    const el = document.createElement('div');
                    el.className = 'walk-item';

                    const start = new Date(walk.startTime);
                    const dateStr = start.toLocaleDateString('ru-RU') + ' ' + start.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                    const distStr = walk.distance >= 1000 
                        ? `${(walk.distance / 1000).toFixed(2)} км` 
                        : `${Math.round(walk.distance)} м`;

                    el.innerHTML = `
                        <div class="walk-info">
                            <div class="walk-date">${dateStr}</div>
                            <div class="walk-metrics">
                                <div class="metric-group">
                                    <span class="metric-label">Дистанция</span>
                                    <span class="metric-value">${distStr}</span>
                                </div>
                                <div class="metric-group">
                                    <span class="metric-label">Ср. Скорость</span>
                                    <span class="metric-value">${walk.avgSpeed} км/ч</span>
                                </div>
                            </div>
                        </div>
                        <button class="btn-delete" title="Удалить" onclick="window.app.deleteWalk('${walk.id}', event)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    `;

                    el.onclick = () => this.openWalkOnMap(walk.id);
                    container.appendChild(el);
                });
            }

            setMapLayer(layerType) {
                this.applyLayerToMap(this.map, 'map-container', layerType, 'btn-layer', 'route-layer', 'point-layer');
            }

            setTrackingMapLayer(layerType) {
                this.applyLayerToMap(this.trackingMap, 'tracking-map-container', layerType, 'btn-tr-layer', 'live-route-layer');
            }

            applyLayerToMap(mapInstance, containerId, layerType, btnPrefix, routeLayerId, pointLayerId) {
                if (!mapInstance) return;
                this.activeLayer = layerType;

                document.querySelectorAll(`[id^="${btnPrefix}-"]`).forEach(b => b.classList.remove('active'));
                const targetBtn = document.getElementById(`${btnPrefix}-${layerType}`);
                if (targetBtn) targetBtn.classList.add('active');

                const container = document.getElementById(containerId);
                if (layerType === 'osm') {
                    container.classList.add('monochrome-map');
                } else {
                    container.classList.remove('monochrome-map');
                }

                ['osm', 'topo', 'sat'].forEach(l => {
                    if (mapInstance.getLayer(`layer-${l}`)) {
                        mapInstance.setLayoutProperty(`layer-${l}`, 'visibility', l === layerType ? 'visible' : 'none');
                    }
                });

                const theme = this.cfg.ui.theme;
                const palette = this.cfg.tracks.colors[theme][layerType];

                if (mapInstance.getLayer(routeLayerId)) {
                    mapInstance.setPaintProperty(routeLayerId, 'line-color', palette.line);
                }
                if (pointLayerId && mapInstance.getLayer(pointLayerId)) {
                    mapInstance.setPaintProperty(pointLayerId, 'circle-color', palette.point);
                    mapInstance.setPaintProperty(pointLayerId, 'circle-stroke-color', palette.stroke);
                }
            }

            openWalkOnMap(walkId) {
                this.selectedWalk = this.walks.find(w => w.id === walkId);
                if (!this.selectedWalk || !this.selectedWalk.track.length) return;

                this.showScreen('screen-map');

                const start = new Date(this.selectedWalk.startTime);
                const end = new Date(this.selectedWalk.endTime);
                const durationMin = Math.round((end - start) / 1000 / 60);

                document.getElementById('map-date-label').innerText = start.toLocaleDateString('ru-RU');
                document.getElementById('map-metrics-dist').innerText = `${(this.selectedWalk.distance / 1000).toFixed(2)} км`;
                document.getElementById('map-metrics-speed').innerText = `${this.selectedWalk.avgSpeed} км/ч`;
                document.getElementById('map-metrics-time').innerText = `${durationMin} мин`;

                const slider = document.getElementById('timeline-slider');
                slider.max = this.selectedWalk.track.length - 1;
                slider.value = this.selectedWalk.track.length - 1;

                const coordinates = this.selectedWalk.track.map(p => [p.lng, p.lat]);
                const bounds = coordinates.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
                
                setTimeout(() => {
                    this.map.resize();
                    this.map.fitBounds(bounds, { padding: 50, animate: false });
                }, 200);

                this.updateMapRoute(this.selectedWalk.track.length - 1);
            }

            onTimelineInput(val) {
                this.updateMapRoute(val);
            }

            updateMapRoute(index) {
                if (!this.selectedWalk) return;

                const slicedTrack = this.selectedWalk.track.slice(0, parseInt(index) + 1);
                const coords = slicedTrack.map(p => [p.lng, p.lat]);

                if (this.map.getSource('route-source')) {
                    this.map.getSource('route-source').setData({
                        type: 'Feature',
                        geometry: { type: 'LineString', coordinates: coords }
                    });
                }

                if (coords.length > 0 && this.map.getSource('point-source')) {
                    const currentPoint = coords[coords.length - 1];
                    this.map.getSource('point-source').setData({
                        type: 'Feature',
                        geometry: { type: 'Point', coordinates: currentPoint }
                    });

                    const pointObj = slicedTrack[slicedTrack.length - 1];
                    if (pointObj && pointObj.timestamp) {
                        const pointTime = new Date(pointObj.timestamp);
                        document.getElementById('timeline-time').innerText = pointTime.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    }
                }
            }

            calculateDistance(track) {
                let total = 0;
                for (let i = 0; i < track.length - 1; i++) {
                    total += this.haversineDistance(track[i], track[i + 1]);
                }
                return total;
            }

            haversineDistance(c1, c2) {
                const R = 6371000;
                const dLat = (c2.lat - c1.lat) * Math.PI / 180;
                const dLon = (c2.lng - c1.lng) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                        Math.sin(dLon / 2) * Math.sin(dLon / 2) * Math.cos(c1.lat * Math.PI / 180) * Math.cos(c2.lat * Math.PI / 180);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            window.app = new RouteTrackerApp();
        });
    </script>
</body>
</html>
